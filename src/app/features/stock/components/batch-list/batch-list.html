<p>batch-list works!</p>
<div class="table-container">
  <table mat-table [dataSource]="stock()">
    <!-- Coluna Nome -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Produto</th>
      <td mat-cell *matCellDef="let item">{{ item.nome }}</td>
    </ng-container>

    <!-- Coluna Quantidade de Pacotes -->
    <ng-container matColumnDef="quantidadePacotes">
      <th mat-header-cell *matHeaderCellDef>Pacotes</th>
      <td mat-cell *matCellDef="let item">{{ item.estoqueDistribuidoTotal }} pacotes</td>
    </ng-container>

    <!-- Coluna Quantidade por Pacote -->
    <ng-container matColumnDef="quantidadePorPacote">
      <th mat-header-cell *matHeaderCellDef>Qtd por Pacote</th>
      <td mat-cell *matCellDef="let item">({{ item.unidadesPorProduto }} unidades cada)</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
